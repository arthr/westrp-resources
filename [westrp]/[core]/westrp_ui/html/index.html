<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WestRP UI Dock Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       CONTAINER HUD DOCK LATERAL (ROCKSTAR NATIVE INTERACTION MENU)
       ============================================================ -->
  <div id="dock-container" class="dock-container" style="display: none;">

    <!-- Cabeçalho de Identificação & Contador -->
    <header class="dock-header">
      <div class="dock-header-brand">
        <span class="dock-category-tag" id="dock-tag">FRONTIER</span>
        <h2 class="dock-title" id="dock-title">REGISTRO</h2>
      </div>
      <div class="dock-counter-pill" id="dock-item-counter">1 / 1</div>
    </header>

    <!-- Barra de Abas Horizontais com Setas (◄ NOME DA ABA ►) -->
    <div class="dock-tabs-bar" id="dock-tabs-bar" style="display: none;">
      <button class="tab-arrow-btn" id="btn-tab-prev" title="Aba Anterior (◄)">◄</button>
      <div class="tab-title-wrap">
        <span class="tab-index-badge" id="dock-tab-index">ABA 1 / 1</span>
        <h3 class="current-tab-name" id="current-tab-name">GERAL</h3>
      </div>
      <button class="tab-arrow-btn" id="btn-tab-next" title="Próxima Aba (►)">►</button>
    </div>

    <!-- Indicador de Submenu / Breadcrumb de Retorno -->
    <div class="dock-breadcrumb" id="dock-breadcrumb" style="display: none;">
      <span class="breadcrumb-back-key">◂ BACKSPACE</span>
      <span class="breadcrumb-title" id="dock-breadcrumb-title">SUBMENU</span>
    </div>

    <!-- Viewport da Lista Vertical Interativa -->
    <div class="dock-viewport" id="dock-viewport" tabindex="0">
      <!-- Elementos gerados dinamicamente via app.js -->
    </div>

    <!-- Caixa de Contexto / Descrição do Item Selecionado -->
    <div class="dock-info-box" id="dock-info-box">
      <p id="dock-info-text">Selecione uma opção para interagir.</p>
    </div>

    <!-- Rodapé de Legenda de Teclas de Navegação Nativa -->
    <footer class="dock-footer-keys">
      <div class="k-group"><span class="k-box">▲▼</span> <span class="k-label">Navegar</span></div>
      <div class="k-group" id="k-tabs-legend"><span class="k-box">◄►</span> <span class="k-label">Abas/Opções</span></div>
      <div class="k-group"><span class="k-box">↵</span> <span class="k-label">Executar</span></div>
      <div class="k-group"><span class="k-box">BACKSPACE</span> <span class="k-label">Voltar</span></div>
      <div class="k-group"><span class="k-box">ESC</span> <span class="k-label">Fechar</span></div>
    </footer>

  </div>

  <!-- Container Global de Notificações Toasts -->
  <div id="toast-container"></div>

  <!-- Script do Motor NUI Generalizado -->
  <script src="js/app.js"></script>
</body>
</html>
