<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUD Dock de Comando Territorial - VORP Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       CONTAINER HUD DOCK LATERAL (ROCKSTAR NATIVE INTERACTION MENU)
       ============================================================ -->
  <div id="admin-dock" class="admin-dock-container" style="display: none;">

    <!-- Cabeçalho de Identificação & Contador -->
    <header class="dock-header">
      <div class="dock-header-brand">
        <span class="dock-category-tag" id="dock-staff-role">FRONTIER ADMINISTRATION</span>
        <h2 class="dock-title">REGISTRO DE COMANDO</h2>
      </div>
      <div class="dock-counter-pill" id="dock-item-counter">1 / 1</div>
    </header>

    <!-- Barra de Abas Horizontais com Setas (◄ NOME DA ABA ►) -->
    <div class="dock-tabs-bar" id="dock-tabs-bar">
      <button class="tab-arrow-btn" id="btn-tab-prev" title="Aba Anterior (Seta Esquerda)">◄</button>
      <div class="tab-title-wrap">
        <span class="tab-index-badge" id="dock-tab-index">ABA 1 / 5</span>
        <h3 class="current-tab-name" id="current-tab-name">UTILITÁRIOS</h3>
      </div>
      <button class="tab-arrow-btn" id="btn-tab-next" title="Próxima Aba (Seta Direita)">►</button>
    </div>

    <!-- Indicador de Submenu / Breadcrumb de Retorno -->
    <div class="dock-breadcrumb" id="dock-breadcrumb" style="display: none;">
      <span class="breadcrumb-back-key">◂ BACKSPACE</span>
      <span class="breadcrumb-title" id="dock-breadcrumb-title">AÇÕES DO CIDADÃO</span>
    </div>

    <!-- Viewport da Lista Vertical Interativa (Navegação por Setas ▲ ▼) -->
    <div class="dock-viewport" id="dock-viewport" tabindex="0">
      <!-- Elementos .dock-item gerados dinamicamente via app.js -->
    </div>

    <!-- Caixa de Contexto / Descrição do Item Selecionado -->
    <div class="dock-info-box" id="dock-info-box">
      <p id="dock-info-text">Selecione uma opção para gerenciar os recursos da fronteira.</p>
    </div>

    <!-- Rodapé de Legenda de Teclas de Navegação Nativa -->
    <footer class="dock-footer-keys">
      <div class="k-group"><span class="k-box">▲▼</span> <span class="k-label">Navegar</span></div>
      <div class="k-group"><span class="k-box">◄►</span> <span class="k-label">Abas</span></div>
      <div class="k-group"><span class="k-box">↵</span> <span class="k-label">Executar</span></div>
      <div class="k-group"><span class="k-box">BACKSPACE</span> <span class="k-label">Voltar</span></div>
      <div class="k-group"><span class="k-box">ESC</span> <span class="k-label">Fechar</span></div>
    </footer>

    <!-- Container de Notificações Rápidas (Toasts) -->
    <div id="toast-container"></div>

  </div>

  <!-- Script da Aplicação -->
  <script src="js/app.js"></script>
</body>
</html>
