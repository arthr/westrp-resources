<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160b06">
  <title>West RP — Carregando</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="config.js" defer></script>
  <script src="assets/js/script.js" defer></script>
</head>
<body>
  <main class="loading-screen" aria-label="Carregando West RP">
    <img class="loading-screen__background" src="assets/img/carregamento.png" alt="" draggable="false">
    <div class="loading-screen__shade"></div>
    <canvas id="embers" class="embers" aria-hidden="true"></canvas>

    <header class="server-header">
      <span class="server-header__line"></span>
      <div class="server-header__brand">
        <span class="server-header__eyebrow">REDM ROLEPLAY</span>
        <strong id="server-name">WEST RP</strong>
      </div>
      <span class="server-header__line"></span>
    </header>

    <aside class="connection-status" aria-live="polite">
      <span class="connection-status__dot"></span>
      <span id="connection-label">CONECTANDO AO OESTE</span>
    </aside>

    <section class="loading-panel">
      <div class="loading-panel__topline">
        <div>
          <span class="loading-panel__kicker">PREPARANDO SUA JORNADA</span>
          <h1 id="loading-stage">Entrando na fronteira...</h1>
        </div>
        <strong id="loading-percentage" class="loading-panel__percentage">0%</strong>
      </div>

      <div class="progress" role="progressbar" aria-label="Progresso do carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress__fill">
          <span class="progress__glow"></span>
        </div>
      </div>

      <ol class="loading-steps" aria-label="Etapas do carregamento">
        <li data-step="0"><span></span>Conexão</li>
        <li data-step="1"><span></span>Recursos</li>
        <li data-step="2"><span></span>Mundo</li>
        <li data-step="3"><span></span>Personagem</li>
      </ol>

      <div class="loading-panel__footer">
        <p class="tip"><span>DICA</span><span id="tip-text">Respeite a história de cada personagem.</span></p>
        <p class="loading-panel__hint">Aguarde enquanto preparamos tudo para você</p>
      </div>
    </section>
  </main>
</body>
</html>
